# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
subject: repo:wasmCloud/wasmcloud.com:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: wasmCloud/wasmcloud.com/.github/workflows/update-version.yml@refs/heads/main

# Push the docs/update-version-X.Y.Z branch and open its PR. An app token,
# unlike GITHUB_TOKEN, lets that PR trigger CI.
permissions:
  contents: write
  pull_requests: write
