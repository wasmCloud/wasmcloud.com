# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
# The pull_request_target run after a merge and a workflow_dispatch run from
# main both use the workflow file on main.
subject_pattern: repo:wasmCloud/wasmcloud\.com:(pull_request|ref:refs/heads/main)
claim_pattern:
  job_workflow_ref: wasmCloud/wasmcloud\.com/\.github/workflows/tag-after-merge\.yml@refs/heads/main

# Push the docs-vX.Y.Z tag. An app token, unlike GITHUB_TOKEN, lets that
# push trigger release-docs.yml.
permissions:
  contents: write
