version: 2

updates:
  - directory: /
    package-ecosystem: github-actions
    schedule:
      interval: daily
    # Wait 7 days after a release before proposing it,
    # so a compromised release has time to be caught upstream.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - directory: /
    package-ecosystem: npm
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    # Wait 7 days after a release before proposing it,
    # so a compromised release has time to be caught upstream.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
