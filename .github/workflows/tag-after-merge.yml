name: Tag after release-bump merge

# When a `release-bump`-labeled PR (opened by update-version.yml) merges to
# main, push `docs-v<version>`. That tag triggers release-docs.yml, which
# publishes the offline docs image + tarball matching the new docs pin.
#
# Version is extracted from the PR title set by update-version.yml:
#   "docs: update wasmCloud version to 2.1.0"
#
# workflow_dispatch is a manual escape hatch: pass a version explicitly to
# push a docs-v tag from main without going through the PR-bump flow. Useful
# when update-version.yml has failed to open the PR and the offline docs
# pipeline needs to catch up.

on:
  # pull_request_target runs this file from main, so its OIDC token carries
  # the job_workflow_ref the tag-after-merge trust policy requires. The job
  # checks out main, never the PR, and reads the PR title only through env.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g., 2.5.1). Pushes docs-v<version> from main HEAD."
        required: true
        type: string

permissions:
  contents: read

# Opt into Node 24 for bundled-JS actions ahead of GitHub's June 16, 2026 cutoff.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'release-bump'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged with octo-sts for the tag-after-merge token.
      id-token: write
    steps:
      # An app token (not GITHUB_TOKEN) so the tag push triggers
      # release-docs.yml.
      - name: Get a tag-after-merge token from octo-sts
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: tag-after-merge

      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Extract version
        id: ver
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          else
            prefix='docs: update wasmCloud version to '
            if [[ "$PR_TITLE" != "${prefix}"* ]]; then
              echo "::error::PR title does not match expected prefix; got '$PR_TITLE'"
              exit 1
            fi
            version="${PR_TITLE#${prefix}}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::extracted version '$version' is not valid semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push docs-v${{ steps.ver.outputs.version }} tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="docs-v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            echo "::notice::tag ${tag} already exists; skipping"
            exit 0
          fi
          git tag -a "${tag}" -m "Offline docs release ${tag} (cuts ghcr.io/wasmcloud/docs:${VERSION})"
          git push origin "${tag}"
          echo "Pushed ${tag}; release-docs.yml will take over."
