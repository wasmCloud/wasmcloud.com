name: CI - Build

on:
  workflow_call: {}

permissions:
  contents: read

# Opt into Node 24 for bundled-JS actions ahead of GitHub's June 16, 2026 cutoff.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - name: Docusaurus Cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: node_modules/.cache
          key: ${{ runner.os }}-docusaurus-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-docusaurus-

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-assets
          path: |
            build/

  offline-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # The release Dockerfile builds without Git or .git metadata.
      - name: Build offline image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: wasmcloud-docs:ci
          cache-from: type=gha,scope=offline-docs
          cache-to: type=gha,mode=max,scope=offline-docs

      - name: Smoke test offline image
        shell: bash
        run: |
          trap 'docker logs offline-docs; docker rm --force offline-docs' EXIT
          docker run --detach --name offline-docs --publish 127.0.0.1:8080:80 wasmcloud-docs:ci
          for route in / /docs/installation/ /blog/; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 \
              "http://127.0.0.1:8080${route}"
          done
          curl --fail --silent --show-error --output "$RUNNER_TEMP/offline-blog-post.html" \
            --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 \
            http://127.0.0.1:8080/blog/wasmcloud-third-anniversary/
          grep -Fq 'The codebase got less intimidating' "$RUNNER_TEMP/offline-blog-post.html"
