name: Create Community Meeting Agenda
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date of next community meeting, in the form of YYYY-MM-DD"
        required: true
        type: string
      livestream_url:
        description: "URL of YouTube livestream for community meeting"
        required: true
        type: string

permissions: {}

# Opt into Node 24 for bundled-JS actions ahead of GitHub's June 16, 2026 cutoff.
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  create_agenda:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exchanged with octo-sts for the agenda token.
      id-token: write
    env:
      MEETING_DATE: ${{ inputs.date }}
      LIVESTREAM_URL: ${{ inputs.livestream_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # agenda.sh substitutes both values into sed expressions and file paths.
      - name: Validate inputs
        run: |
          if [[ ! "$MEETING_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD"
            exit 1
          fi
          if [[ ! "$LIVESTREAM_URL" =~ ^https://(www\.)?(youtube\.com|youtu\.be)/[A-Za-z0-9_?=\&/.-]+$ ]]; then
            echo "::error::livestream_url must be a YouTube URL"
            exit 1
          fi
      - name: Create Community Agenda
        run: bash agenda.sh "$MEETING_DATE" "$LIVESTREAM_URL"
      # An app token (not GITHUB_TOKEN) so the agenda PR can be opened and
      # triggers CI.
      - name: Get an agenda token from octo-sts
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: agenda
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          commit-message: added community meeting agenda for ${{ inputs.date }}
          title: Community Agenda ${{ inputs.date }}
          body: This is the community meeting agenda for ${{ inputs.date }}. Agenda items are forthcoming because bleep bloop I am a bot.
          branch: community/${{ inputs.date }}
          sign-commits: true
          signoff: true
