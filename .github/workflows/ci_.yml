name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: docusaurus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: $/.github/workflows/ci_build.yml

  structured-data:
    uses: $/.github/workflows/ci_structured_data.yml
    permissions:
      contents: read
      pull-requests: write   # passthrough for the sticky PR comment

  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: '1.31.1'
          inputs: .github/workflows
          advanced-security: false
          annotations: true

  # The required check for this workflow. It runs even when a job above fails
  # or is skipped, and fails if any of them failed.
  ci-check:
    needs: [build, structured-data, workflow-security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
