header:
  schema-version: 2.2.0
  last-updated: '2026-11-02'
  last-reviewed: '2026-10-30'
  url: https://raw.githubusercontent.com/wasmCloud/wasmcloud.com/main/security-insights.yml
  project-si-source: https://raw.githubusercontent.com/wasmCloud/wasmCloud/main/security-insights.yml
  comment: >-
    Repository-level data for wasmCloud/wasmcloud.com. Project-level data,
    including vulnerability reporting, is in the wasmCloud/wasmCloud file above.

repository:
  url: https://github.com/wasmCloud/wasmcloud.com
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: wasmCloud docs maintainers (@wasmCloud/docs-maintainers)
      social: https://github.com/wasmCloud/wasmcloud.com/blob/main/MAINTAINERS.md#wasmclouddocs-maintainers
      primary: true
  license:
    url: https://github.com/wasmCloud/wasmcloud.com/blob/main/LICENSE
    expression: CC-BY-4.0 AND Apache-2.0
  documentation:
    contributing-guide: https://github.com/wasmCloud/wasmcloud.com/blob/main/CONTRIBUTING.md
    governance: https://github.com/wasmCloud/wasmCloud/blob/main/GOVERNANCE.md
    security-policy: https://github.com/wasmCloud/.github/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://wasmcloud.com
        comment: The website and documentation, deployed from main.
      - uri: https://github.com/wasmCloud/wasmcloud.com/releases
        comment: >-
          Offline documentation tarball for each wasmCloud release, tagged
          docs-v<version>. A wasmCloud release opens the version-bump PR here,
          and merging it tags and publishes the release.
      - uri: https://github.com/wasmCloud/wasmcloud.com/pkgs/container/docs
        comment: ghcr.io/wasmcloud/docs image serving the offline documentation, tagged <version> and latest.
    changelog: https://github.com/wasmCloud/wasmcloud.com/releases/tag/docs-v{version}
  security:
    assessments:
      self:
        name: wasmCloud security self-assessment
        evidence: https://github.com/wasmCloud/wasmCloud/blob/main/SELF_ASSESSMENT.md
        date: '2026-10-27'
        comment: >-
          The wasmCloud project self-assessment, with its threat model in
          wasmCloud/wasmCloud THREAT_MODEL.md. It covers the software these
          docs describe, not the site itself.
    tools:
      - name: CodeQL
        type: SAST
        comment: >-
          Analyzes the site's TypeScript and JavaScript and the GitHub Actions
          workflows on every pull request, on pushes to main and weekly. A pull
          request that adds a high or critical severity alert is blocked from
          merging; see CONTRIBUTING.md#code-scanning.
        rulesets:
          - security-extended
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: CodeQL analysis
            predicate-uri: https://codeql.github.com
            location: https://github.com/wasmCloud/wasmcloud.com/security/code-scanning
      - name: Dependabot
        type: SCA
        comment: Dependabot alerts and security-update PRs, plus version updates for npm and GitHub Actions.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
