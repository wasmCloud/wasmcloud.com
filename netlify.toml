headers = [
  # docusaurus-plugin-llms generates a Markdown file per docs page for
  # "View as Markdown" to link to. Netlify serves *.md as text/markdown by
  # default, which Chrome downloads instead of rendering inline. "**" isn't
  # documented Netlify header syntax and doesn't match files with no
  # subdirectory (e.g. /docs/index.md), so both rules are needed.
  { for = "/docs/*.md", values = { Content-Type = "text/plain; charset=utf-8" } },
  { for = "/docs/**/*.md", values = { Content-Type = "text/plain; charset=utf-8" } },
]

# force redirects from 'docs' to 'docs/'
[build.processing.html]
  pretty_urls = true
