# Serve docs Markdown inline, including files directly under /docs/.
[[headers]]
  for = "/docs/*.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/docs/**/*.md"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Everything under /assets/ is written by webpack with a content hash in its
# name (main.a1143984.js, washdev-640bdbac….gif), so a URL never changes what
# it serves: browsers keep it for a year without asking again. On Cloudflare
# every revalidation would otherwise be a billed Worker request.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Third-party hosts: Google Tag Manager and the tags it loads, HubSpot
    # (tracking and the /contact form with reCAPTCHA), Reo, Algolia DocSearch,
    # Netlify RUM and YouTube embeds. A tag added in GTM needs its hosts here.
    Content-Security-Policy-Report-Only = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' \
        https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net \
        https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ \
        https://js.hs-scripts.com https://js.hs-analytics.net https://js.hs-banner.com https://js.hsadspixel.net \
        https://js.hscollectedforms.net https://js.hsforms.net https://js.hubspot.com \
        https://static.reo.dev https://analytics.ahrefs.com https://assets.apollo.io https://d-code.liadm.com \
        https://connect.facebook.net https://snap.licdn.com; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com data:; \
      img-src 'self' data: https:; \
      connect-src 'self' \
        https://*.algolia.net https://*.algolianet.com \
        https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com \
        https://stats.g.doubleclick.net https://ad.doubleclick.net https://www.google.com \
        https://api.hubapi.com https://cta-service-cms2.hubspot.com https://js.hs-banner.com \
        https://forms.hscollectedforms.net https://*.hsforms.com \
        https://api.reo.dev https://aplo-evnt.com https://idx.liadm.com https://rp.liadm.com \
        https://px.ads.linkedin.com https://ingesteer.services-prod.nsvcs.net https://api.github.com; \
      frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com/recaptcha/ \
        https://i.liadm.com https://www.facebook.com; \
      frame-ancestors 'self'; \
      base-uri 'self'; \
      form-action 'self'"""
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# force redirects from 'docs' to 'docs/'
[build.processing.html]
  pretty_urls = true
